# Cairn server API endpoint.
server: "http://cairn-server:8000"
# Dispatcher-only bearer credential; provision only its digest in the Server deployment.
# server_token: "<opaque dispatcher token>"
# FIRST RUN (required): before starting DispatcherLoop, the Server operator must set
# CAIRN_AUTH_DISPATCHER_TOKEN in the Server-only environment and start/restart the Server
# (or run the equivalent deployment bootstrap). Server startup stores only its SHA-256
# digest in auth_credentials. Then set server_token below to the same opaque value.
# There is intentionally no unauthenticated endpoint that creates the first credential;
# without this Server-side seed the dispatcher's authenticated bootstrap call is denied.
# Legacy credential cutover is deliberately opt-in and one-time. After inventorying
# an upgraded database, set this Server-only environment variable to exactly
# "revoke" and restart the Server; it revokes all still-unowned pre-migration
# credentials (including custom helper actor/scope rows), records an audit row, and
# is idempotent on later restarts. Leave it unset to preserve manual credentials.
# CAIRN_AUTH_LEGACY_CREDENTIAL_CUTOVER: "revoke"
# The Server may also consume a deployment snapshot built from this config. Its
# dispatcher_token must equal server_token; helper_token is read from helper_token_env
# and never committed.
# CAIRN_AUTH_DEPLOYMENT_SNAPSHOT: '{"dispatcher_token":"<same opaque dispatcher token>","helper_token":"<from helper env>","targets":{"target-user":"https://target.example.com/login"}}'

# Real-environment login authentication. Credentials live in the execution environment
# (the auth store), while only AuthSessionVerified / AuthSessionInvalid facts enter the
# graph. Secrets must never be written into facts, intents, hints or agent prompts.
#
# auth:
#   helper_token_env: "CAIRN_AUTH_HELPER_TOKEN"  # helper reads this deployment env var
#   helper_scopes: ["helper.event.submit", "helper.request.read"]
#   helper_project_allowlist: ["*"]
#   store_root: "/opt/cairn/auth"     # host path, read-write for the dispatcher
#   worker_mount_root: "/run/cairn-auth"  # read-only mount inside the worker container
#   login_timeout: 900                 # seconds to wait for the operator to log in
#   verify_timeout: 30                 # seconds per verification layer
#   intervention:
#     enabled: true                    # route auth requests to a human operator
#     request_ttl: 1800                # seconds before an active request is marked expired
#     claim_ttl: 300                   # seconds a helper may hold a claim before it is released
#     allow_roles:                     # roles the agent may request auth for (empty = allow all)
#       - user
#       - admin
#   targets:
#     - name: "target-user"            # logical auth_ref the agent sees
#       base_url: "https://target.example.com"
#       login_url: "https://target.example.com/login"
#       role: "user"
#       indexed_db: true
#       verify:
#         url: "https://target.example.com/dashboard"
#         expect_status: 200
#         selector: "[data-testid='user-menu']"
#         http_url: "https://target.example.com/api/me"
#         http_expect_status: 200
#     - name: "target-admin"
#       base_url: "https://target.example.com"
#       login_url: "https://target.example.com/login"
#       role: "admin"
#       verify:
#         url: "https://target.example.com/admin"
#         selector: "#admin-panel"
#
# Desktop auth helper (runs on the operator's real desktop, not in Docker):
#
#   cairn auth-helper \
#     --server http://localhost:8000 \
#     --config dispatch.yaml \
#     --helper-name my-desktop \
#     --auto-launch \
#     --max-parallel 1

# Shared environment variables merged into every worker.
common_env:
  TSEC_SERVER_HOST: "<SERVER_HOST>:8000"
  TSEC_AGENT_TOKEN: "xxx"

runtime:
  # Scheduler tick interval in seconds.
  interval: 3
  # Global concurrency cap across all workers and all projects.
  max_workers: 8
  # Maximum number of projects that may be actively scheduled at the same time.
  max_running_projects: 3
  # Per-project worker cap. Prevents one project from monopolizing the whole dispatcher.
  max_project_workers: 4
  # Timeout for each enabled worker healthcheck.
  healthcheck_timeout: 20
  # "startup_and_task" checks at dispatcher startup and before every task.
  # "startup_only" checks only at startup. "disabled" skips automatic worker checks.
  worker_healthcheck: "startup_only"
  # Prompt set loaded from cairn/src/cairn/dispatcher/prompts/.
  prompt_group: "default"

tasks:
  bootstrap:
    # Main execution timeout for the initial direct solve attempt.
    timeout: 300
    # Time budget for conclude fallback after the main phase times out or returns unusable output.
    conclude_timeout: 90
  reason:
    # Reason decides whether the goal is met and whether new intents should be proposed.
    timeout: 300
    # Hard cap on how many new intents one reason step may create.
    max_intents: 2
  explore:
    # Main execution timeout for exploring a claimed intent.
    timeout: 300
    # Time budget for conclude fallback used to summarize confirmed findings from the same session.
    conclude_timeout: 90

container:
  # Base worker container. The dispatcher execs agent commands inside one container per project.
  image: "ghcr.io/oritera/cairn-worker-container:latest"
  network_mode: "host"
  # "stop" keeps finished containers for inspection; "remove" is cleaner but loses post-run state.
  completed_action: "stop"
  # Add Linux capabilities only when a task truly needs them, such as packet crafting or network admin actions.
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"


workers:
  # Worker priority is ascending: lower numbers are preferred first.
  # max_running is per-worker concurrency. Slower backends such as Pi usually benefit from lower values.
  - name: "claudecode_deepseek-v4-pro"
    type: "claudecode"
    task_types: [bootstrap, reason, explore]
    max_running: 2
    priority: 0
    env:
      ANTHROPIC_MODEL: "deepseek-v4-pro"
      ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
      ANTHROPIC_AUTH_TOKEN: "sk-xxx"

